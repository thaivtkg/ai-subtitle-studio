name: Automated Tests Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Run Unit & Headless UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & X11/Qt)
        run: |
          sudo apt-get update
          # Cài đặt FFmpeg cho FasterWhisper Audio Chunking
          # Cài đặt xvfb và các thư viện X11/xcb bắt buộc để chạy PySide6 Headless
          sudo apt-get install -y ffmpeg xvfb libegl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-cursor0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Core & UI Tests (Headless Mode)
        env:
          # Ép Qt không tìm màn hình vật lý mà dùng offscreen rendering
          QT_QPA_PLATFORM: offscreen
          # Đảm bảo mã hóa chuẩn khi print log trên CI
          PYTHONIOENCODING: utf-8
        run: |
          # Dùng xvfb-run để bọc tiến trình test, cấp cho nó một màn hình ảo (:99)
          xvfb-run -a python -m unittest discover -s tests -v

      - name: Syntax & Compilation Check
        run: |
          python -m compileall core ui workers tests
